<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 160px); }
        .message-bubble { max-width: 85%; border-radius: 1.25rem; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <div class="max-w-3xl mx-auto flex flex-col h-screen p-4">
        <header class="py-4 border-b border-gray-800 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                Cloudflare AI
            </h1>
            <span class="text-xs bg-gray-800 px-2 py-1 rounded-full text-gray-400">Llama 3.1</span>
        </header>

        <div id="chat-box" class="chat-container overflow-y-auto py-6 space-y-4">
            <div class="flex justify-start">
                <div class="message-bubble bg-gray-800 p-4 text-gray-200">
                    Hello! How can I help you today?
                </div>
            </div>
        </div>

        <footer class="pt-4">
            <form id="chat-form" class="relative">
                <input 
                    type="text" 
                    id="user-input"
                    class="w-full bg-gray-800 border border-gray-700 rounded-2xl py-4 pl-4 pr-16 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                    placeholder="Type a message..."
                    autocomplete="off"
                >
                <button 
                    type="submit"
                    class="absolute right-2 top-2 bottom-2 px-4 bg-blue-600 hover:bg-blue-500 rounded-xl transition-colors font-medium"
                >
                    Send
                </button>
            </form>
        </footer>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        let messages = [];

        function appendMessage(role, content) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `message-bubble p-4 ${
                role === 'user' 
                ? 'bg-blue-600 text-white rounded-br-none' 
                : 'bg-gray-800 text-gray-200 rounded-bl-none'
            }`;
            bubble.innerText = content;
            
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return bubble;
        }

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage('user', text);
            messages.push({ role: 'user', content: text });

            // Create placeholder for AI response
            const aiBubble = appendMessage('assistant', '...');
            let fullAiResponse = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                aiBubble.innerText = ""; // Clear the loading dots

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    // Basic parsing for SSE format
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            try {
                                const data = JSON.parse(line.slice(5));
                                if (data.response) {
                                    fullAiResponse += data.response;
                                    aiBubble.innerText = fullAiResponse;
                                }
                            } catch (e) { /* End of stream or partial JSON */ }
                        }
                    }
                }
                messages.push({ role: 'assistant', content: fullAiResponse });
            } catch (err) {
                aiBubble.innerText = "Error: Could not reach the AI.";
                aiBubble.classList.add('text-red-400');
            }
        };
    </script>
</body>
</html>
