<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben — AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e11;
      --surface: #17171c;
      --surface2: #1f1f26;
      --border: rgba(255,255,255,0.07);
      --accent: #c8f075;
      --accent-dim: rgba(200,240,117,0.12);
      --text: #e8e8ec;
      --text-muted: #6b6b78;
      --user-bg: #1e2a14;
      --user-border: rgba(200,240,117,0.25);
      --radius: 18px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-name {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .logo-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .model-badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 100px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

    .msg {
      display: flex;
      animation: fadeUp 0.2s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .bubble {
      max-width: min(72%, 560px);
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.65;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-bottom-right-radius: 4px;
      color: #d4f0a0;
    }

    .msg.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    /* Attached image styling in chat */
    .chat-image {
      display: block;
      max-width: 100%;
      max-height: 300px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .bubble p { margin-bottom: 0.6em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { color: #fff; font-weight: 500; }
    .bubble em { font-style: italic; color: #c8c8d4; }
    .bubble ul, .bubble ol { padding-left: 1.4em; margin-bottom: 0.6em; }
    .bubble li { margin-bottom: 0.2em; }
    .bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

    .bubble code {
      font-family: 'DM Mono', monospace;
      font-size: 0.85em;
      background: rgba(255,255,255,0.07);
      padding: 1px 5px;
      border-radius: 4px;
      color: #c8f075;
    }

    .bubble pre {
      background: #111115;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0.6em 0;
    }

    .bubble pre code {
      background: none;
      padding: 0;
      color: #a8e6a3;
      font-size: 0.83em;
      line-height: 1.6;
    }

    .bubble h1,.bubble h2,.bubble h3 {
      font-family: 'Instrument Serif', serif;
      font-weight: normal;
      margin-bottom: 0.3em;
      color: #fff;
    }
    .bubble h1 { font-size: 1.3em; }
    .bubble h2 { font-size: 1.15em; }
    .bubble h3 { font-size: 1.05em; }

    .typing-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      border-radius: var(--radius);
      padding: 14px 18px;
      display: none;
    }

    .typing-bubble.visible { display: flex; gap: 5px; align-items: center; }

    .dot {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }

    .welcome-icon {
      font-size: 40px;
      font-family: 'Instrument Serif', serif;
      color: var(--accent);
      line-height: 1;
    }

    .welcome h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.5rem;
      font-weight: normal;
      color: var(--text);
    }

    .welcome p { font-size: 0.9rem; max-width: 340px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 7px 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .suggestion:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .input-area {
      padding: 16px 0 24px;
      flex-shrink: 0;
    }

    .input-wrapper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.2s;
      overflow: hidden;
    }

    .input-wrapper:focus-within {
      border-color: rgba(200,240,117,0.3);
      box-shadow: 0 0 0 3px rgba(200,240,117,0.05);
    }

    /* Preview area for selected image */
    #image-preview-bar {
      display: none;
      padding: 12px 16px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .preview-thumbnail {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--accent);
    }

    .remove-image-btn {
      position: absolute;
      top: 6px;
      left: 56px;
      background: var(--bg);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .input-main {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 10px 10px 12px;
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 180px;
      overflow-y: auto;
      padding: 6px 0;
    }

    #user-input::placeholder { color: var(--text-muted); }

    .action-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .attach-btn {
      background: none;
      color: var(--text-muted);
    }
    .attach-btn:hover { color: var(--accent); background: var(--accent-dim); }

    #send-btn {
      background: var(--accent);
      color: #0e0e11;
    }

    #send-btn:hover:not(:disabled) { background: #d8ff85; transform: scale(1.05); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 16px; height: 16px; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <div class="logo">
        <span class="logo-name">Ben</span>
        <span class="logo-tag">AI Assistant</span>
      </div>
      <span class="model-badge">Llama 3.2 Vision</span>
    </header>

    <div id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h2>How can I help?</h2>
        <p>Ask me anything — or share an image for me to analyze.</p>
        <div class="suggestions">
          <button class="suggestion" onclick="suggest(this)">Explain async/await in JS</button>
          <button class="suggestion" onclick="suggest(this)">Write a haiku about rain</button>
          <button class="suggestion" onclick="suggest(this)">Debug my Python code</button>
          <button class="suggestion" onclick="suggest(this)">Summarize a concept</button>
        </div>
      </div>
    </div>

    <div class="msg assistant" id="typing-row" style="display:none">
      <div class="typing-bubble visible">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <!-- Image Preview Bar -->
        <div id="image-preview-bar">
          <img id="img-preview-src" class="preview-thumbnail">
          <div class="remove-image-btn" onclick="clearSelectedImage()">×</div>
        </div>

        <div class="input-main">
          <!-- Attachment Button -->
          <input type="file" id="file-input" accept="image/*" style="display:none">
          <button class="action-btn attach-btn" onclick="document.getElementById('file-input').click()" title="Attach image">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>

          <textarea id="user-input" rows="1" placeholder="Message Ben…" autofocus></textarea>
          
          <button id="send-btn" aria-label="Send">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="14" x2="8" y2="2"/>
              <polyline points="3,7 8,2 13,7"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="input-hint">Enter to send · Shift+Enter for new line</p>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────
    let history = [];
    let busy = false;
    let selectedImageBase64 = null;

    const messagesEl = document.getElementById('messages');
    const welcomeEl  = document.getElementById('welcome');
    const typingRow  = document.getElementById('typing-row');
    const inputEl    = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    
    const fileInput = document.getElementById('file-input');
    const previewBar = document.getElementById('image-preview-bar');
    const previewImg = document.getElementById('img-preview-src');

    // ── Image Handling ─────────────────────────────────────
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = event => {
        selectedImageBase64 = event.target.result.split(',')[1];
        previewImg.src = event.target.result;
        previewBar.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function clearSelectedImage() {
      selectedImageBase64 = null;
      fileInput.value = '';
      previewBar.style.display = 'none';
    }

    // ── Auto-resize textarea ───────────────────────────────
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    });

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    sendBtn.addEventListener('click', sendMessage);

    function suggest(el) {
      inputEl.value = el.textContent;
      inputEl.dispatchEvent(new Event('input'));
      inputEl.focus();
    }

    // ── Simple Markdown renderer ───────────────────────────
    function renderMarkdown(text) {
      let html = text
        .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
          `<pre><code class="language-${lang}">${escHtml(code.trim())}</code></pre>`)
        .replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm,  '<h2>$1</h2>')
        .replace(/^# (.+)$/gm,   '<h1>$1</h1>')
        .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
        .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/^---$/gm, '<hr>')
        .split('\n\n')
        .map(block => {
          const trimmed = block.trim();
          if (!trimmed) return '';
          if (/^<(h[1-3]|ul|ol|pre|hr)/.test(trimmed)) return trimmed;
          return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
        })
        .join('\n');
      return html;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function appendBubble(role, html) {
      const row = document.createElement('div');
      row.className = `msg ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = html;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollBottom();
      return bubble;
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── Send ───────────────────────────────────────────────
    async function sendMessage() {
      const text = inputEl.value.trim();
      if ((!text && !selectedImageBase64) || busy) return;

      if (welcomeEl) welcomeEl.remove();

      busy = true;
      sendBtn.disabled = true;
      inputEl.disabled = true;
      
      const currentImage = selectedImageBase64;
      const currentText = text;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      
      // Build user bubble content
      let userDisplayHtml = '';
      if (currentImage) {
        userDisplayHtml += `<img src="data:image/png;base64,${currentImage}" class="chat-image">`;
      }
      userDisplayHtml += escHtml(currentText).replace(/\n/g, '<br>');
      
      appendBubble('user', userDisplayHtml);
      clearSelectedImage();

      typingRow.style.display = 'flex';
      scrollBottom();

      const row = document.createElement('div');
      row.className = 'msg assistant';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      row.appendChild(bubble);
      messagesEl.appendChild(row);

      let rawText = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            messages: history, 
            prompt: currentText, 
            image: currentImage 
          }),
        });

        if (!res.ok || !res.body) throw new Error('Request failed');

        typingRow.style.display = 'none';

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n');
          buffer = parts.pop() ?? '';

          for (const line of parts) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const data = trimmed.slice(5).trim();
            if (data === '[DONE]') break;
            try {
              const json = JSON.parse(data);
              const token = json.response ?? json.choices?.[0]?.delta?.content ?? '';
              if (token) {
                rawText += token;
                bubble.innerHTML = renderMarkdown(rawText);
                scrollBottom();
              }
            } catch {}
          }
        }

        if (rawText) {
          history.push({ role: 'assistant', content: rawText });
        } else {
          bubble.innerHTML = '<em style="color:var(--text-muted)">No response received.</em>';
        }

      } catch (err) {
        typingRow.style.display = 'none';
        bubble.innerHTML = '<em style="color:#ff6b6b">Something went wrong. Please try again.</em>';
        console.error(err);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
        scrollBottom();
      }
    }
  </script>
</body>
</html>
